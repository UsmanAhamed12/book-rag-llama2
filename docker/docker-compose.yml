services:
  postgres:
    image: postgres:16
    container_name: book-rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api

    container_name: book-rag-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ../data:/app/data

    environment:
      POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_HOST: http://host.docker.internal:11434

      CHROMA_DB_PATH: ${CHROMA_DB_PATH}
      CHROMA_PATH: ${CHROMA_PATH}
      UPLOAD_DIR: ${UPLOAD_DIR}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend

    container_name: book-rag-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: