services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api

    container_name: rag-api

    ports:
      - "8000:8000"

    volumes:
      - ../data:/app/data

    environment:
      POSTGRES_URL: postgresql+psycopg://postgres:postgres123@postgres:5432/book_rag


    depends_on:
      - postgres



  frontend:

    build:
      context: ..

      dockerfile: docker/Dockerfile.frontend


    container_name: rag-frontend


    ports:
      - "8501:8501"


    depends_on:
      - api



  postgres:

    image: postgres:16


    container_name: rag-postgres


    restart: always


    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres123

      POSTGRES_DB: book_rag


    ports:

      - "5432:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data



volumes:

  postgres_data: